# PGSA control: gain+shift SMOOTHED but in a SHUFFLED band order.
# vs full PGSA (correct-order smoothing): isolates whether the *spectral structure* of the
# smoothness is the active ingredient, vs generic smoothing of 8 numbers.
# If shuffled ≈ baseline/random and full > shuffled => spectral order matters (real physics).
seed: 42
data: {root: "G:/MCOD", size: 384, cache: "G:/MCOD/cache352", multiscale: true, physics_aug: true, physics_aug_mode: shuffled}
model: {type: sds, v_arch: swin_small_patch4_window7_224, nv_arch: swin_tiny_patch4_window7_224, pretrained: true}
train: {batch: 8, workers: 4, lr: 1.0e-4, epochs: 300, eval_interval: 15}
loss: {l_iou: 1.0, l_edge: 0.5, l_opp: 0.0, l_phys: 0.0, l_ds: 0.5, l_ssim: 1.0, weighted: true}
